[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-inference"
version = "0.3.0"
description = "Adaptive resource coordination and durable task continuation for local AI agents"
readme = "README.md"
requires-python = ">=3.11"
# The complete source archive and runtime wheel contain different licensed code.
# Omit a shared expression; LICENSE, NOTICE and the retained upstream notices
# describe their scopes. See https://packaging.python.org/en/latest/specifications/pyproject-toml/#license
license-files = ["LICENSE", "NOTICE", "third_party/*/LICENSE", "third_party/*/NOTICE", "examples/validation/latency_drift/LICENSE.river"]
authors = [{name = "Midhat Nashar and contributors"}]
dependencies = ["aiohttp==3.14.5", "psutil==7.2.2"]
keywords = ["inference", "scheduling", "agents", "llama-cpp", "adaptive"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/midhatn/adaptive-inference"
Issues = "https://github.com/midhatn/adaptive-inference/issues"
Documentation = "https://github.com/midhatn/adaptive-inference/tree/main/docs"

[project.scripts]
adaptive-inference = "adaptive_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
