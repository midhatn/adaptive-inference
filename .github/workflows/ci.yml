name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v --failfast
        env:
          CONTINUATION_TEST_RECEIPTS: ${{ runner.temp }}/continuation-child-receipts
      - name: Preserve continuation child diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: continuation-children-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/continuation-child-receipts/*.json
          if-no-files-found: warn
      - run: python -m unittest discover -s provenance -p "test_*.py" -v
      - run: python -m pip install httpx==0.28.1
      - run: python examples/validation/hermes_tool_task/test_boundary.py
      - run: python -m unittest discover -s examples/validation/windows_handoff/foreground -v
      - run: python -m unittest discover -s examples/validation/windows_handoff/native -v
      - run: python -m unittest discover -s examples/validation/windows_handoff -p test_arithmetic_feedback.py -v
      - run: python -m unittest discover -s examples/validation/windows_handoff -p test_shutdown_receipts.py -v
      - run: python -m unittest discover -s examples/validation/windows_handoff -p test_historical_native_sources.py -v
      - run: python -m unittest discover -s provenance/windows-handoff/sanitizer -p "test_*.py" -v
      - run: python third_party/reference-sources/verify.py
      - run: python provenance/client-config-transports/verify-sources.py
      - run: python integrations/strata/setup.py --verify-only
      - run: python integrations/hermes/setup.py --verify-only
      - run: adaptive-inference demo --output demo-result.json
      - run: adaptive-inference profiles
      - run: python -m build
      - run: python provenance/check_distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.os }}-py${{ matrix.python }}
          path: demo-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: complete-source-and-runtime
          path: dist/*

  offline-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python provenance/offline_acceptance.py --output "${{ runner.temp }}/offline-proof"
      - run: python integrations/hermes/current-source/restore_delta.py --repository . --output "${{ runner.temp }}/hermes-current" > current-hermes-source-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-source-proof
          path: |
            ${{ runner.temp }}/offline-proof/result.json
            current-hermes-source-result.json
